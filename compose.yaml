services:
  valheim:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stop_grace_period: 3m
    ports:
      - "2456-2457:2456-2457/udp"
      - "8080:8080"
    volumes:
      - game:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /app/venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  game:
