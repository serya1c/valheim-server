services:
  valheim:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stop_grace_period: 3m
    ports:
      - "2456-2457:2456-2457/udp"
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8080}:8080"
    environment:
      SERVER_NAME: ${SERVER_NAME:-Loki}
      WORLD_NAME: ${WORLD_NAME:-North}
      SERVER_PASSWORD: ${SERVER_PASSWORD:?Set SERVER_PASSWORD in .env}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?Set PANEL_PASSWORD in .env}
      SERVER_PUBLIC: ${SERVER_PUBLIC:-1}
      REQUIRE_PUBLIC_LISTING: ${REQUIRE_PUBLIC_LISTING:-1}
      BACKUP_HOURS: ${BACKUP_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TZ: ${TZ:-UTC}
    volumes:
      - game:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /app/venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  game:
