name: Admin mod

# Пересборка встроенного Hearth Admin под актуальную сборку Valheim.
# Если игра обновилась — мод пересобирается, версия бампается,
# allowlist версий дополняется и открывается PR в main.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # ежедневно 03:00 UTC
  push:
    branches: [ main ]
    paths:
      - 'game-mods/ValheimAdminRu/**'
      - 'tools/game-version/**'
      - '.github/workflows/mod.yml'

concurrency:
  group: mod-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  VALHEIM_APP_ID: '896660'
  GAME_DIR: ${{ github.workspace }}/.valheim
  BEPINEX_DIR: ${{ github.workspace }}/.bepinex

jobs:
  rebuild:
    name: Сборка мода под текущую игру
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Публичный UpToDateCheck не отдаёт 896660, а выделенный сервер
      # скачивается примерно за минуту — кэш не нужен и только врёт при апдейте.
      - name: SteamCMD
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lib32gcc-s1 lib32stdc++6 ca-certificates
          if ! command -v steamcmd >/dev/null; then
            mkdir -p "$HOME/steamcmd"
            curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$HOME/steamcmd"
            echo "STEAMCMD=$HOME/steamcmd/steamcmd.sh" >> "$GITHUB_ENV"
          else
            echo "STEAMCMD=steamcmd" >> "$GITHUB_ENV"
          fi

      - name: Выделенный сервер Valheim
        run: |
          set -uo pipefail
          # steamcmd отдаёт код 1 и при успехе, и при сбое загрузки конфигурации
          # (лечится sSteamCmdForcePlatformType). Проверяем результат по файлам.
          for attempt in 1 2 3; do
            "$STEAMCMD" +@sSteamCmdForcePlatformType linux \
              +force_install_dir "$GAME_DIR" +login anonymous \
              +app_update "$VALHEIM_APP_ID" validate +quit || true
            if [ -f "$GAME_DIR/valheim_server_Data/Managed/assembly_valheim.dll" ]; then
              echo "попытка $attempt: сервер скачан"
              break
            fi
            echo "попытка $attempt не удалась, пауза"; sleep 15
          done
          test -f "$GAME_DIR/valheim_server_Data/Managed/assembly_valheim.dll"
          echo "server files: $(du -sh "$GAME_DIR" | cut -f1)"

      - name: BepInExPack с Thunderstore
        run: |
          set -euo pipefail
          version=$(curl -fsS https://thunderstore.io/api/experimental/package/denikson/BepInExPack_Valheim/ | jq -r .latest.version_number)
          echo "BepInExPack_Valheim $version"
          mkdir -p "$BEPINEX_DIR"
          curl -fsSL -o "$RUNNER_TEMP/bepinex.zip" "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/$version/"
          unzip -q -o "$RUNNER_TEMP/bepinex.zip" -d "$BEPINEX_DIR"
          test -f "$BEPINEX_DIR/BepInExPack_Valheim/BepInEx/core/BepInEx.dll"

      - name: Версия игры из лога сервера
        id: game
        run: |
          set -euo pipefail
          version=$(bash tools/game-version/probe.sh "$GAME_DIR" 150)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Valheim: $version"

      - name: Мод уже собран под эту версию?
        id: target
        run: |
          set -euo pipefail
          current=$(python game-mods/ValheimAdminRu/target_game.py --read)
          echo "src=$current" >> "$GITHUB_OUTPUT"
          echo "В коде: $current, в Steam: ${{ steps.game.outputs.version }}"
          if [ "$current" = "${{ steps.game.outputs.version }}" ]; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            python game-mods/ValheimAdminRu/target_game.py --set "${{ steps.game.outputs.version }}"
          fi

      - name: Сборка плагина
        run: |
          set -euo pipefail
          dotnet build game-mods/ValheimAdminRu/ValheimAdminRu.csproj -c Release --nologo \
            -p:ValheimDir="$GAME_DIR" \
            -p:ManagedDir="$GAME_DIR/valheim_server_Data/Managed" \
            -p:BepInExCore="$BEPINEX_DIR/BepInExPack_Valheim/BepInEx/core"

      - name: Упаковка встроенного мода
        run: python game-mods/ValheimAdminRu/package.py

      # Ночная пересборка DLL даёт другие байты при том же коде. Если версия,
      # allowlist и описатель не изменились — это не повод для PR.
      - name: Нужен ли PR
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REFRESH: ${{ steps.target.outputs.refresh }}
        run: |
          set -euo pipefail
          if git diff --quiet -- app/builtin-mods game-mods/ValheimAdminRu; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Архив и исходники совпадают — обновлять нечего."
            exit 0
          fi
          echo "Расхождения с закоммиченным состоянием:"
          git diff --stat -- app/builtin-mods game-mods/ValheimAdminRu
          if python tools/mod_archive.py --event "$EVENT" --refresh "$REFRESH" > /tmp/needed; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "PR не нужен: сборка отличается только байтами."
          fi
          echo "Причина: $(cat /tmp/needed)"

      - name: Ветка и PR с пересобранным модом
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GAME: ${{ steps.game.outputs.version }}
        run: |
          set -euo pipefail
          mod=$(grep -oP '<Version>\K[^<]+' game-mods/ValheimAdminRu/ValheimAdminRu.csproj | head -1)
          branch="automation/admin-mod-${GAME}-v${mod}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add app/builtin-mods game-mods/ValheimAdminRu
          git commit -m "mod: Hearth Admin $mod для Valheim $GAME"
          git push -f origin "$branch"
          if [ "$GAME" = "${{ steps.target.outputs.src }}" ]; then
            title="Hearth Admin $mod: свежая сборка встроенного архива"
            body="Автоматическая пересборка под Valheim $GAME.
          Версия игры не менялась, но собранный архив отличался от закоммиченного
          (встроенный мод отставал от исходников). Обновлены app/builtin-mods/ValheimAdminRu.zip и .json."
          else
            title="Hearth Admin $mod для Valheim $GAME"
            body="Автоматическая пересборка встроенного мода под новую сборку Valheim $GAME.
          Обновлены GameCompatibility (BuildVersion + allowlist), версия мода и встроенный архив."
          fi
          gh pr create --base main --head "$branch" --title "$title" --body "$body" \
            || echo "PR уже существует — ветка обновлена."

      - uses: actions/upload-artifact@v4
        with:
          name: hearth-admin-mod
          path: |
            app/builtin-mods/ValheimAdminRu.zip
            app/builtin-mods/ValheimAdminRu.json
