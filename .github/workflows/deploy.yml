name: Deploy

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Деплой, даже если текущий контейнер не healthy'
        type: boolean
        default: false
  push:
    branches: [ main ]
    # Перезапуск игрового сервера только когда меняется то, что попадает
    # в образ. Коммиты в docs, workflows и хост-скрипты игру не трогают.
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'compose.second.yaml'
      - 'game-mods/**'
      # Тесты мода не входят в образ: их правка не должна перезапускать игру.
      - '!game-mods/**/tests/**'

concurrency:
  group: deploy-valheim
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Только порт проверки: пути, имена проекта и контейнера знает deploy-valheim.
  HEALTH_URL: http://127.0.0.1:8080/health

jobs:
  deploy:
    name: Пересборка и перезапуск
    # Self-hosted раннер: облачный раннер не видит приватную сеть хоста.
    runs-on: [self-hosted, valheim]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Stage
        run: rsync -a --delete --exclude='.git' ./ /tmp/valheim-incoming/

      - name: Deploy (build + restart, откат при неудаче)
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            sudo -n /usr/local/bin/deploy-valheim --force
          else
            sudo -n /usr/local/bin/deploy-valheim
          fi

      - name: Verify
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 "$HEALTH_URL" >/dev/null; then
              echo "health OK"; curl -fsS "$HEALTH_URL"; exit 0
            fi
            sleep 5
          done
          echo "health-check не прошёл"
          docker ps --format '{{.Names}} {{.Status}}' | head -20 || true
          exit 1
