name: Release

# Лаунчер и установщики пересобираются только при изменении их исходников
# (и при пуше тега v*). Артефакты кладутся в релиз.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'launcher/**'
      - 'installer/**'
      - 'installer-linux/**'
      - 'installer-tests/**'
      - 'game-mods/ValheimAdminRu/**'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  # gh release create --generate-notes читает PR и коммиты: без этого права
  # шаг публикации падает с "Resource not accessible by integration".
  pull-requests: read

jobs:
  launcher:
    name: Лаунчер (Windows + Linux + setup)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Зависимости Avalonia
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1
      - name: Синхронизация lock-файлов
        run: |
          set -euo pipefail
          dotnet restore launcher/HearthLauncher.csproj --configfile launcher/NuGet.Config --force-evaluate
          dotnet restore launcher/setup/HearthLauncherSetup.csproj --configfile launcher/NuGet.Config --force-evaluate
      - name: Сборка лаунчера
        run: bash launcher/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-assets
          path: launcher/.build/assets/*
          if-no-files-found: error

  installer-windows:
    name: Установщик модов (Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Публикация Loki-Mod-Installer.exe
        run: |
          set -euo pipefail
          dotnet publish installer/LokiInstaller.csproj -c Release -r win-x64 --self-contained true \
            -p:EnableWindowsTargeting=true -o "$RUNNER_TEMP/installer"
          mkdir -p dist
          cp "$RUNNER_TEMP/installer/Loki-Mod-Installer.exe" dist/
          cd dist
          sha256sum Loki-Mod-Installer.exe > Loki-Mod-Installer.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*
          if-no-files-found: error

  installer-linux:
    name: Установщик модов (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Сборка Loki-Mod-Installer-Linux.sh
        run: |
          set -euo pipefail
          python installer-linux/build.py
          mkdir -p dist
          cp app/downloads/Loki-Mod-Installer-Linux.sh* dist/
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/*
          if-no-files-found: error

  release:
    name: Публикация релиза
    if: startsWith(github.ref, 'refs/tags/v')
    # Установщики ниже собираются ради проверки исходников, в релиз не попадают.
    needs: [ launcher, installer-windows, installer-linux ]
    runs-on: ubuntu-latest
    steps:
      # gh release create определяет репозиторий по git remote: без checkout
      # шаг падал с "failed to run git: not a git repository".
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: launcher-assets
          path: dist/launcher
      - name: Собрать релизный набор
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          # В релизе только то, чем пользуются игроки и владелец сервера:
          # сборки лаунчера, встроенный админ-мод, архив проекта и контрольные суммы.
          for name in Hearth-Launcher-Setup.exe Hearth-Launcher.exe Hearth-Launcher-Windows-x64.zip \
                      Hearth-Launcher-Linux.tar.gz Hearth-Launcher-Install-Linux.sh; do
            cp "dist/launcher/$name" release/
          done
          mod=$(python -c "import json;print(json.load(open('app/builtin-mods/ValheimAdminRu.json'))['version'])")
          cp app/builtin-mods/ValheimAdminRu.zip "release/Hearth-Admin-$mod.zip"
          git archive --format=zip -9 --prefix="valheim-server-${TAG#v}/" -o "release/valheim-server-$TAG.zip" HEAD
          # Сам SHA256SUMS.txt в список не попадает: его ещё нет на момент подсчёта.
          (cd release && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' |
             sort | xargs sha256sum > SHA256SUMS.txt)
          ls -l release
      - name: gh release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Релиз $TAG уже существует."
          elif out=$(gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes 2>&1); then
            echo "$out"
          else
            echo "::error::gh release create --generate-notes: $(echo "$out" | tail -20)"
            if ! out=$(gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Сборки лаунчера, встроенный Hearth Admin, архив проекта и SHA256SUMS." 2>&1); then
              echo "::error::gh release create --notes: $(echo "$out" | tail -20)"
              exit 1
            fi
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release/* --clobber
