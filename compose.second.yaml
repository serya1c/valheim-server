services:
  valheim:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    init: true
    stop_grace_period: 3m
    ports:
      - "2466-2467:2466-2467/udp"
      - "127.0.0.1:8081:8080"
    environment:
      GAME_PORT: "2466"
      GAME_QUERY_PORT: "2467"
    volumes:
      - game:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /app/venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  game:
